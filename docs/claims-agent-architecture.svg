<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Claims Research Agent architecture</title>
  <desc id="desc">Questions flow to an agent that searches policy text and calls read-only claims data tools. Retrieved evidence and claim facts are summarized for human review. A separate evaluation set measures retrieval ranking.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#55708b"/></marker>
    <style>
      .box { fill:#f6f9fc; stroke:#42617e; stroke-width:2; rx:14; }
      .source { fill:#edf7f3; stroke:#34836a; stroke-width:2; rx:14; }
      .out { fill:#fff4e8; stroke:#bf7527; stroke-width:2; rx:14; }
      .title { font:600 18px Arial,sans-serif; fill:#152b40; text-anchor:middle; }
      .sub { font:14px Arial,sans-serif; fill:#3e5368; text-anchor:middle; }
      .arrow { fill:none; stroke:#55708b; stroke-width:2.2; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="38" class="title" font-size="24">Claims Research Agent</text>
  <rect x="35" y="115" width="175" height="90" class="box"/>
  <text x="122" y="150" class="title">Analyst</text><text x="122" y="177" class="sub">Question or claim ID</text>
  <rect x="285" y="115" width="190" height="90" class="box"/>
  <text x="380" y="150" class="title">Agent orchestrator</text><text x="380" y="177" class="sub">Local mode or optional LLM</text>
  <rect x="560" y="75" width="190" height="90" class="source"/>
  <text x="655" y="110" class="title">Policy retrieval</text><text x="655" y="137" class="sub">TF-IDF + cosine similarity</text>
  <rect x="560" y="205" width="190" height="90" class="source"/>
  <text x="655" y="240" class="title">Read-only tools</text><text x="655" y="267" class="sub">Claim lookup + aggregates</text>
  <rect x="805" y="115" width="160" height="90" class="out"/>
  <text x="885" y="150" class="title">Research summary</text><text x="885" y="177" class="sub">Sources + human review</text>
  <path d="M210 160 H280" class="arrow"/><path d="M475 145 H555" class="arrow"/><path d="M475 175 C515 175 515 250 555 250" class="arrow"/>
  <path d="M750 120 C780 120 780 145 800 150" class="arrow"/><path d="M750 250 C780 250 780 185 800 170" class="arrow"/>
  <rect x="285" y="330" width="465" height="65" class="box"/>
  <text x="517" y="357" class="title">Curated retrieval evaluation</text><text x="517" y="380" class="sub">Precision@3 Â· Recall@3 Â· MRR</text>
  <path d="M655 295 V325" class="arrow"/>
</svg>

